name: Weather alert

on:
  schedule:
    # Every hour. GitHub runs these late and skips many of them.
    # Night runs leave the message at ntfy to be delivered at 06:00.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send a notification even if there are no alerts"
        type: boolean
        default: false

# one run at a time, so the same alert isn't sent twice
concurrency: weather-alert

permissions:
  contents: read
  actions: write  # needed for the keep-alive step below

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # what was already sent today
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Check the weather
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # these are optional, set them under Settings > Variables if you want
          LANGUAGE: ${{ vars.LANGUAGE }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub turns off scheduled workflows on public repos after 60 days
      # without activity. Re-enabling counts as activity, so doing it on every
      # run keeps the schedule alive forever.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable weather-alert.yml
